[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "diabetes-prediction"
version = "0.1.0"
description = "ML Package for predicting the onset of diabetes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name="babaksoft", email="babak.eslamieh@gmail.com" },
]
keywords = ["machine learning", "classification"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license-files = ["LICEN[CS]E*"]

dependencies = [
"tqdm==4.67.3",
"numpy==2.4.2",
"pandas==2.3.3",
"scipy==1.17.0",
"matplotlib==3.10.8",
"scikit-learn==1.8.0",
"seaborn==0.13.2",
"joblib==1.5.3",
"mlflow==3.9.0",
"mlflow-skinny==3.9.0",
"psycopg2-binary==2.9.11",
"fastapi[standard]==0.128.7",
"uvicorn==0.40.0",
"pydantic==2.12.5",
"streamlit==1.54.0",
"requests==2.32.5",
"black==26.3.1",
"ruff==0.15.7",
"mypy==1.19.1",
"pytest==9.0.2",
"build==1.3.0",
"hatchling==1.28.0"
]

[project.urls]
Homepage = "https://github.com/babaksoft/diabetes-prediction"
Issues = "https://github.com/babaksoft/diabetes-prediction/issues"

[project.optional-dependencies]
build = ["build"]
dev = ["pytest"]

[tool.hatch.build]
exclude = [
    "/.dvc",
    "**/*.dvc",
    "**/.gitignore",
    "/notebooks",
    "/tests",
    ".gitignore",
    ".dvcignore",
    "requirements.txt"
]
